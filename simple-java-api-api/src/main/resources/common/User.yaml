openapi: 3.0.3
info:
  version: 1.0.0
  title: User
servers: [ ]
paths: { }

components:
  schemas:
    UserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          example: Luke Skywalker
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
          example: luke.skywalker@example.com
      required:
        - name
        - email
    UserDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Luke Skywalker
        email:
          type: string
          format: email
          example: luke.skywalker@example.com
      required:
        - id
        - name
        - email
    UserResponse:
      type: object
      properties:
        name:
          type: string
          example: Luke Skywalker
        email:
          type: string
          example: luke.skywalker@example.com
      required:
        - name
        - email
