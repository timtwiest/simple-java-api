name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        id: maven-verify
        continue-on-error: true
        run: >-
          ./mvnw --batch-mode --no-transfer-progress clean verify
          2>&1 | tee maven-build.log

      - name: Report Maven failure
        if: steps.maven-verify.outcome == 'failure'
        run: |
          summary=$(grep -E '^\[ERROR\]|Failures: [1-9]|Errors: [1-9]|<<< (FAILURE|ERROR)' maven-build.log \
            | tail -n 12 \
            | tr '\n' ' ' \
            | cut -c 1-2000)
          echo "::error title=Maven verification failed::${summary:-See the test-diagnostics artifact for details.}"
          exit 1

      - name: Scan dependency SBOM
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/src:ro"
          --workdir /src
          ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
          scan source -L /src/target/bom.json

      - name: Build container image
        run: docker build --tag simple-java-api:ci .

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: simple-java-api:ci
          version: v0.76.0
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-report
          path: simple-java-api-app/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-diagnostics
          path: |
            simple-java-api-app/target/surefire-reports/
            simple-java-api-app/target/failsafe-reports/
            simple-java-api-app/target/*.dump
            simple-java-api-app/target/*.dumpstream
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cyclonedx-sbom
          path: target/bom.json
          if-no-files-found: ignore
          retention-days: 7

  publish-edge:
    name: Publish edge image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish edge image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/timtwiest/simple-java-api:edge
            ghcr.io/timtwiest/simple-java-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Simple Java API
            org.opencontainers.image.description=Contract-first Spring Boot REST API
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=edge
          provenance: mode=max
          sbom: true
          cache-from: type=gha
