name: Release container

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/timtwiest/simple-java-api

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release tag and source
        id: release
        shell: bash
        run: |
          release_tag="${{ inputs.tag || github.ref_name }}"
          version="${release_tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          project_version=$(python3 -c \
            'import sys, xml.etree.ElementTree as ET; root = ET.parse("pom.xml").getroot(); print(root.find("{http://maven.apache.org/POM/4.0.0}version").text)')
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag version $version does not match Maven version $project_version." >&2
            exit 1
          fi
          release_sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$release_sha" origin/master; then
            echo "Release tags must point to a commit on master." >&2
            exit 1
          fi
          major="${version%%.*}"
          remainder="${version#*.}"
          minor="${remainder%%.*}"
          {
            echo "version=$version"
            echo "tag=$release_tag"
            echo "sha=$release_sha"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:$version"
            echo "${IMAGE_NAME}:$major.$minor"
            echo "${IMAGE_NAME}:$major"
            echo "${IMAGE_NAME}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Require successful master build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          successful_runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs" \
            -f branch=master \
            -f event=push \
            -f status=success \
            -f head_sha="${{ steps.release.outputs.sha }}" \
            -f per_page=1 \
            --jq '.total_count')
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "No successful master build exists for $GITHUB_SHA." >&2
            exit 1
          fi

      - name: Verify release source
        id: maven-verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress clean verify \
            -DskipITs -Djacoco.skip=true \
            2>&1 | tee maven-release.log

      - name: Report Maven failure
        if: steps.maven-verify.outcome == 'failure'
        run: |
          summary=$(grep -E '^\[ERROR\]|Failures: [1-9]|Errors: [1-9]|<<< (FAILURE|ERROR)' maven-release.log \
            | tail -n 12 \
            | tr '\n' ' ' \
            | cut -c 1-2000)
          echo "::error title=Maven release verification failed::${summary:-See the release-test-diagnostics artifact for details.}"
          exit 1

      - name: Upload release test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-test-diagnostics-${{ github.ref_name }}
          path: |
            maven-release.log
            simple-java-api-app/target/surefire-reports/
            simple-java-api-app/target/failsafe-reports/
            simple-java-api-app/target/*.dump
            simple-java-api-app/target/*.dumpstream
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image for security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: simple-java-api:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: simple-java-api:release-candidate
          version: v0.76.0
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Simple Java API
            org.opencontainers.image.description=Contract-first Spring Boot REST API
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Publish galactic release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Episode ${{ steps.release.outputs.version }}: The API Awakens"
          if gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            gh release edit "${{ steps.release.outputs.tag }}" --title "$title" --draft=false
          else
            gh release create "${{ steps.release.outputs.tag }}" --verify-tag --generate-notes --title "$title"
          fi
