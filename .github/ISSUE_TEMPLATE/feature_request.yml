name: ✨ Feature request
description: Suggest an improvement or new capability.
title: "✨ "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 🎯 Problem
      description: What problem or limitation would this feature address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 💡 Proposed solution
      description: Describe the behavior or API you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔀 Alternatives considered
      description: Which workarounds or alternative designs have you considered?

  - type: textarea
    id: context
    attributes:
      label: 🧭 Additional context
      description: Add examples, contract snippets, or links that help explain the request.

  - type: checkboxes
    id: checks
    attributes:
      label: ✅ Before submitting
      options:
        - label: I searched existing issues and the roadmap for similar requests.
          required: true
